# Apple Silicon kernels ship no thunderbolt module, and mkinitcpio fails the
# whole image over a MODULES entry it cannot find, leaving an initramfs it warns
# may be incomplete. Add it only where it exists.
if modinfo -k "${KERNELVERSION:-$(uname -r)}" thunderbolt >/dev/null 2>&1; then
  MODULES+=(thunderbolt)
fi
