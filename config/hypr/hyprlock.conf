source = ~/.local/state/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = false
}

background {
    monitor =
    color = $color
    path = ~/.local/state/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = false
}

# Branded clock face above the password input.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $font_color
    font_size = 72
    font_family = ShureTechMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $font_color
    font_size = 20
    font_family = ShureTechMono Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = ShureTechMono Nerd Font Mono
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
